[package]
name = "roup"
version = "0.8.0"
authors = ["Anjia Wang <anjia@ouankou.com>"]
edition = "2024"
rust-version = "1.88.0"  # MSRV: Verified against all required Rust dependencies and tools
license = "BSD-3-Clause"
description = "Safe Rust parser for typed OpenMP and OpenACC directive ASTs"
repository = "https://github.com/ouankou/roup"
documentation = "https://roup.ouankou.com"
homepage = "https://roup.ouankou.com"
keywords = ["openmp", "openacc", "parser", "hpc", "parallel"]
categories = ["parsing", "science", "development-tools::ffi"]
readme = "README.md"
build = false
autobins = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/RELEASE_NOTES.md",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[workspace]
members = [".", "crates/roup-capi"]
default-members = ["."]
resolver = "2"

[dependencies]
nom = "8.0.0"
once_cell = "1.21.4"

[dev-dependencies]
criterion = "0.8.2"

[lib]
crate-type = ["rlib"]

# Benchmark configuration
[[bench]]
name = "line_continuations"
harness = false
