name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust ${{ matrix.rust }} full suite on ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format cmake g++ gcc gfortran make ninja-build pkg-config python3 ripgrep

      - name: Install pinned mdBook
        run: cargo install mdbook --version 0.5.4 --locked

      - name: Run every repository and upstream compatibility test
        run: ./test.sh

      - name: Package tested documentation
        if: ${{ matrix.rust == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p docs/book/book/api
          cp -R target/doc/. docs/book/book/api/

      - name: Configure GitHub Pages
        if: ${{ matrix.rust == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !env.ACT }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ matrix.rust == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  basic:
    name: Rust ${{ matrix.rust }} basic build on ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        rust: ["1.88", stable]
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Run the basic Rust build and test gate
        run: |
          cargo fmt --all --check
          cargo check --locked -p roup --all-targets
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, basic]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
